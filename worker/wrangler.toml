name = "companion-worker"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Checks once a minute for messages that are due.
[triggers]
crons = ["* * * * *"]

# Create the namespace with `npx wrangler kv namespace create STORE` (run in this
# folder) and paste the id it prints below.
[[kv_namespaces]]
binding = "STORE"
id = "51b99a95299e4720ba6c48ca9a4aa3a5"

[vars]
# The pages allowed to call this Worker: the published app, and the app and
# test pages run locally. Every request also needs the APP_KEY secret.
ALLOWED_ORIGINS = "https://fabpharos.github.io,http://localhost:5173,http://localhost:4174,http://localhost:4173"

# Secrets, set with `npx wrangler secret put <NAME>`, never written in this file:
#   APP_KEY            shared secret the app sends as X-App-Key
#   VAPID_PUBLIC_KEY   from `npm run vapid-keys`
#   VAPID_PRIVATE_KEY  from `npm run vapid-keys`
#   VAPID_SUBJECT      a mailto: or https:// contact URL
